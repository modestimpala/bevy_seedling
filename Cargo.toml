[package]
name = "bevy_seedling"
version = "0.8.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
authors = ["Corvus Prudens <corvusprudens@gmail.com>"]
description = "A sprouting integration of the Firewheel audio engine"
readme = "README.md"
repository = "https://github.com/corvusprudens/bevy_seedling"
documentation = "https://docs.rs/bevy_seedling"
keywords = ["gamedev", "audio", "bevy", "firewheel"]
categories = ["game-development", "multimedia::audio"]
exclude = ["/assets"]

[features]
default = ["wav", "ogg", "rand", "reflect", "cpal", "diagnostics"]
resample_inputs = ["firewheel/cpal_resample_inputs"]
rand = ["dep:rand"]
reflect = ["firewheel/bevy_reflect", "firewheel-ircam-hrtf?/bevy_reflect"]
cpal = ["firewheel/cpal", "dep:cpal"]
rtaudio = ["dep:rtaudio", "firewheel/rtaudio"]
web_audio = ["dep:firewheel-web-audio"]
dev = ["entity_names", "track_location"]
entity_names = []
track_location = []
symphonia = ["dep:symphonia", "dep:symphonium", "firewheel/symphonium"]
diagnostics = ["dep:bevy_diagnostic", "firewheel/node_profiling"]

# formats
wav = ["symphonia", "symphonium/wav", "symphonium/pcm"]
ogg = ["symphonia", "symphonium/ogg", "symphonium/vorbis"]
flac = ["symphonia", "symphonium/flac"]
mkv = ["symphonia", "symphonium/mkv"]

# codecs
mp3 = ["symphonia", "symphonium/mp3"]
adpcm = ["symphonia", "symphonium/adpcm"]

# nodes
hrtf = ["dep:firewheel-ircam-hrtf"]
# embed all HRTF subjects
hrtf_subjects = ["firewheel-ircam-hrtf?/all_subjects"]
loudness = ["dep:ebur128", "dep:portable-atomic"]
effects = ["firewheel/all_nodes"]

# Enables profiling and testing backend compilation.
# This is mainly intended for internal use.
profiling = ["dep:audioadapter-buffers"]

[dependencies]
bevy_ecs = { path = "../bevy/crates/bevy_ecs", default-features = false }
bevy_app = { path = "../bevy/crates/bevy_app", default-features = false }
bevy_math = { path = "../bevy/crates/bevy_math", default-features = false, features = [
  "std",
] }
bevy_asset = { path = "../bevy/crates/bevy_asset", default-features = false }
bevy_transform = { path = "../bevy/crates/bevy_transform", default-features = false, features = [
  "bevy-support",
] }
bevy_log = { path = "../bevy/crates/bevy_log", default-features = false }
bevy_platform = { path = "../bevy/crates/bevy_platform", default-features = false, features = [
  "alloc",
] }
bevy_time = { path = "../bevy/crates/bevy_time", default-features = false }
bevy_reflect = { path = "../bevy/crates/bevy_reflect", default-features = false, features = [
  "glam",
] }
bevy_utils = { path = "../bevy/crates/bevy_utils", default-features = false }
bevy_diagnostic = { path = "../bevy/crates/bevy_diagnostic", default-features = false, optional = true }

firewheel = { path = "../Firewheel", default-features = false, features = [
  "bevy",
  "spatial_basic_node",
  "scheduled_events",
  "musical_transport",
  "glam-33",
  "sampler_node",
  "std",
  "tracing",
] }
symphonium = { version = "0.13", default-features = false, features = [
  "opt-simd",
  "fft-resampler",
  "resampler",
], optional = true }
symphonia = { version = "0.6", default-features = false, optional = true }
smallvec = { version = "1.13", default-features = false }
bevy_seedling_macros = { path = "./seedling_macros", version = "0.8.0" }
rand = { version = "0.10", default-features = false, features = [
  "sys_rng",
], optional = true }
ebur128 = { version = "0.1.10", optional = true }
portable-atomic = { version = "1.11", optional = true, features = ["float"] }
firewheel-ircam-hrtf = { version = "0.5.0", path = "crates/firewheel-ircam-hrtf", optional = true, features = [
  "bevy",
] }
cpal = { version = "0.18", default-features = false, optional = true }
rtaudio = { version = "0.8", default-features = false, optional = true }
firewheel-web-audio = { version = "0.5.0", path = "crates/firewheel-web-audio", optional = true }
audioadapter-buffers = { version = "4.0", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
firewheel = { path = "../Firewheel", features = ["wasm-bindgen"] }

[dev-dependencies]
bevy_seedling = { path = ".", features = [
  "hrtf",
  "loudness",
  "resample_inputs",
  "effects",
] }
firewheel = { path = "../Firewheel", default-features = false, features = [
  "fast_filter_nodes",
] }
bevy = { path = "../bevy", default-features = false, features = [
  "2d_bevy_render",
  "default_app",
  "picking",
  "ui_bevy_render",
  "bevy_winit",
  "default_font",
  "std",
  "sysinfo_plugin",
  "wayland",
  "webgl2",
  "x11",
] }
criterion = { version = "0.5", default-features = false, features = [
  "plotters",
  "cargo_bench_support",
] }
audioadapter-buffers = { version = "4.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4", default-features = false, features = [
  "wasm_js",
] }

[profile.dev]
debug = "line-tables-only"

[[bench]]
name = "basic"
harness = false
required-features = ["profiling"]

[package.metadata.docs.rs]
all-features = true
